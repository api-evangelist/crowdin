apis:
- aid: crowdin:api-v2
  name: Crowdin REST API v2
  description: >-
    Full-coverage REST API for Crowdin and Crowdin Enterprise. Resources include projects, files, source
    strings, string translations, string comments, screenshots, glossaries, MT engines, TMs, tasks, workflows,
    reports, distributions, webhooks, users, groups, and OAuth applications. Authenticate with a Personal
    Access Token or OAuth 2 bearer token.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
